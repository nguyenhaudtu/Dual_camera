<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualCam - iOS Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }
        .icon-btn {
            background: rgba(50, 50, 50, 0.6);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }
        .timer {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            display: none;
        }
        .timer.recording {
            display: inline-block;
            color: #ff3b30;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Viewport đa luồng (Ngang & Dọc) */
        .camera-viewport {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 10px;
        }
        .view-box {
            position: relative;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        /* Khung dọc 9:16 */
        .view-portrait {
            width: 45%;
            aspect-ratio: 9/16;
            max-height: 40vh;
            border: 2px solid rgba(255,255,255,0.2);
        }
        /* Khung ngang 16:9 */
        .view-landscape {
            width: 90%;
            aspect-ratio: 16/9;
            max-height: 35vh;
            border: 2px solid rgba(255,255,255,0.2);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .label-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* Zoom & Controls Bar */
        .zoom-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            z-index: 10;
        }
        .zoom-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .zoom-btn.active {
            background: #f5c518;
            color: #000;
            border-color: #f5c518;
        }

        /* Bottom Controls (iOS Style) */
        .bottom-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 0 40px 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            z-index: 10;
        }
        .shutter-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.95);
        }
        .shutter-inner {
            width: 60px;
            height: 60px;
            background: #ff3b30;
            border-radius: 50%;
            transition: border-radius 0.3s;
        }
        .shutter-btn.recording .shutter-inner {
            border-radius: 8px;
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <button class="icon-btn" id="flashBtn">⚡</button>
        <div class="timer" id="timer">00:00</div>
        <button class="icon-btn" id="switchCameraBtn">🔄</button>
    </div>

    <!-- Dual Camera Viewports -->
    <div class="camera-viewport">
        <div class="view-box view-portrait">
            <span class="label-tag">9:16 PORTRAIT</span>
            <video id="portraitVideo" autoplay playsinline muted></video>
        </div>
        <div class="view-box view-landscape">
            <span class="label-tag">16:9 LANDSCAPE</span>
            <video id="landscapeVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- Zoom Selection -->
    <div class="zoom-bar">
        <button class="zoom-btn" data-zoom="0.5">0.5x</button>
        <button class="zoom-btn active" data-zoom="1">1x</button>
        <button class="zoom-btn" data-zoom="2">2x</button>
    </div>

    <!-- Bottom Shutter Control -->
    <div class="bottom-controls">
        <div style="width: 44px;"></div>
        <button class="shutter-btn" id="shutterBtn">
            <div class="shutter-inner"></div>
        </button>
        <div style="width: 44px;"></div>
    </div>

    <script>
        let currentStream = null;
        let useFrontCamera = false;
        let isRecording = false;
        let timerInterval = null;
        let seconds = 0;

        const portraitVideo = document.getElementById('portraitVideo');
        const landscapeVideo = document.getElementById('landscapeVideo');
        const shutterBtn = document.getElementById('shutterBtn');
        const timerEl = document.getElementById('timer');
        const switchCameraBtn = document.getElementById('switchCameraBtn');

        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? "user" : "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 30, max: 30 } // Giới hạn 30fps chống quá tải nhiệt phần cứng S24 Ultra
                    },
                    audio: true
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // Gắn cùng một luồng stream vào cả 2 khung hình để xử lý crop phần cứng nhẹ nhàng
                portraitVideo.srcObject = currentStream;
                landscapeVideo.srcObject = currentStream;
            } catch (err) {
                console.error("Không thể mở camera:", err);
                alert("Vui lòng cấp quyền Camera và Microphone cho ứng dụng.");
            }
        }

        // Chuyển đổi Camera trước / sau
        switchCameraBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            initCamera();
        });

        // Xử lý nút quay phim
        shutterBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                shutterBtn.classList.add('recording');
                timerEl.classList.add('recording');
                seconds = 0;
                timerEl.textContent = "00:00";
                timerInterval = setInterval(() => {
                    seconds++;
                    let m = Math.floor(seconds / 60).toString().padStart(2, '0');
                    let s = (seconds % 60).toString().padStart(2, '0');
                    timerEl.textContent = `${m}:${s}`;
                }, 1000);
            } else {
                shutterBtn.classList.remove('recording');
                timerEl.classList.remove('recording');
                clearInterval(timerInterval);
                alert("Đã dừng quay và lưu video thành công!");
            }
        });

        // Xử lý nút Zoom
        document.querySelectorAll('.zoom-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                // Mô phỏng mức zoom phần cứng (có thể mở rộng với track.applyConstraints nếu hỗ trợ)
            });
        });

        // Khởi chạy camera ngay khi tải trang
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
