name: Package PWA Source

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PWA Archive
        run: |
          mkdir -p ./pwa-package
          cp index.html ./pwa-package/
          cp manifest.json ./pwa-package/

      - name: Upload PWA Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dual-camera-pwa-source
          path: ./pwa-package
