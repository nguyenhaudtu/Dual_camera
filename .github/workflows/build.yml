name: Build Android PWA Package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create output directory
        run: mkdir -p ./output

      - name: Download & Build Android APK via Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json --directory=./output --skip-validation || true
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-package
          path: ./output
